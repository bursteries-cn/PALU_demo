# @package eval.tofu.metrics.log_topk_tokens
defaults:
  - ../../data/datasets@datasets: TOFU_QA_forget
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: log_topk_tokens
batch_size: 8
k: 5 # 获取 top-5 候选词
positions: [10, 20, 30, 40, 50] # 要查看的 token 位置
split: forget # 使用的数据集 split
output_filename: topk_tokens.json # 输出文件名（会保存在 eval 输出目录中）

datasets:
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}
      question_key: ${eval.tofu.question_key}
